  <rect x="0" y="65" width="460" height="4" class="track" />
  <rect x="0" y="65" width="437.0" height="4" class="bar" />

  <!-- Linux Administration &amp; Production DevOps -->
  <text x="0" y="97" class="label">Linux Administration &amp; Production DevOps</text>
  <text x="460" y="97" class="pct" text-anchor="end">92%</text>
  <rect x="0" y="105" width="460" height="4" class="track" />
  <rect x="0" y="105" width="423.2" height="4" class="bar" />

  <!-- Motion Design &amp; Video VFX -->
  <text x="0" y="137" class="label">Motion Design &amp; Video VFX</text>
  <text x="460" y="137" class="pct" text-anchor="end">92%</text>
  <rect x="0" y="145" width="460" height="4" class="track" />
  <rect x="0" y="145" width="423.2" height="4" class="bar" />

  <!-- Full-Stack Web (Next.js &amp; TypeScript) -->
