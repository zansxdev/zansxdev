<svg width="460" height="324" viewBox="0 0 460 324" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e6edf3;
        letter-spacing: -0.1px;
      }
      .pct {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
      }
      .track {
        fill: #21262d;
        rx: 2px;
      }
      .bar {
        fill: #f0f6fc;
        rx: 2px;
      }
      @media (prefers-color-scheme: light) {
        .label { fill: #1f2328; }
        .pct { fill: #656d76; }
        .track { fill: #eaeef2; }
        .bar { fill: #24292f; }
      }
    </style>
  </defs>

  <!-- WhatsApp &amp; Telegram Bot Ecosystem -->
  <text x="0" y="17" class="label">WhatsApp &amp; Telegram Bot Ecosystem</text>
  <text x="460" y="17" class="pct" text-anchor="end">98%</text>
  <rect x="0" y="25" width="460" height="4" class="track" />
  <rect x="0" y="25" width="450.8" height="4" class="bar" />

  <!-- Fastify &amp; Node.js Backend Architecture -->
  <text x="0" y="57" class="label">Fastify &amp; Node.js Backend Architecture</text>
