  <text x="460" y="177" class="pct" text-anchor="end">88%</text>
  <rect x="0" y="185" width="460" height="4" class="track" />
  <rect x="0" y="185" width="404.8" height="4" class="bar" />

  <!-- Docker &amp; Container Virtualization -->
  <text x="0" y="217" class="label">Docker &amp; Container Virtualization</text>
  <text x="460" y="217" class="pct" text-anchor="end">88%</text>
