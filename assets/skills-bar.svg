<svg width="460" height="378" viewBox="0 0 460 378" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="40%" stop-color="#00b4d8" />
      <stop offset="85%" stop-color="#00f7ff" />
      <stop offset="100%" stop-color="#cbf3f0" />
    </linearGradient>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #e6edf3; letter-spacing: 0.1px; }
      .pct { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #00f7ff; }
      .track { fill: #161b22; stroke: #30363d; stroke-width: 0.5; rx: 4px; }
      .bar { fill: url(#cyan-glow); rx: 4px; }
      .dot { fill: #00f7ff; }
    </style>
  </defs>

